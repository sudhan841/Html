<!DOCTYPE html>
<html>

<head>
    <title>Atharv's Pokémon World</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            background: lightblue;
        }

        h1 {
            color: red;
        }

        .pokemon {
            background: white;
            margin: 20px auto;
            padding: 15px;
            width: 250px;
            border-radius: 15px;
        }

        button {
            padding: 10px;
            font-size: 16px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <h1>⚡ Atharv's Pokémon World ⚡</h1>

    <p>Welcome, Trainer!</p>

    <div class="pokemon">
        <h2>🥋 Lucario</h2>
        <p>Type: Fighting / Steel</p>
        <p>HP: 150</p>
        <button onclick="alert('Lucario used Aura Sphere! 💥')">
            Attack
        </button>
    </div>

    <div class="pokemon">
        <h2>⚡ Pikachu</h2>
        <p>Type: Electric</p>
        <p>HP: 100</p>
        <button onclick="alert('Pikachu used Thunderbolt! ⚡')">
            Attack
        </button>
    </div>

</body>

</html>
